name: Report Bencher benchmarks
description: Report paired pytest-benchmark results from a completed workflow.
branding:
  icon: activity
  color: green

inputs:
  project:
    description: Bencher project slug.
    required: true
  api-key:
    description: Bencher project upload key.
  api-token:
    description: Legacy Bencher API token, used instead of api-key.
  github-token:
    description: GitHub token with actions read, checks write, and pull-requests write.
    default: ${{ github.token }}
  pr-policy:
    description: Use percentage for 25 percent PR alerts or informational for measurements only.
    default: percentage
  ci-id:
    description: Optional identifier for the Bencher GitHub check.
  artifact-name:
    description: Name of the producer's combined benchmark artifact.
    default: benchmark-results-v3

runs:
  using: composite
  steps:
    - name: Check for Benchmark Artifact
      id: check
      shell: bash
      # report.py pages through artifacts because a matrix may upload many
      # unrelated ones, so this probe must paginate too
      run: |
        RUN_ID="$(jq -r '.workflow_run.id // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
        if [ -z "$RUN_ID" ]; then
          echo "::warning::No workflow run in the event payload; proceeding with the Bencher report"
          echo skip=false >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if ! NAMES="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .name' 2>/dev/null)"; then
          echo "::warning::Could not list artifacts for run ${RUN_ID}; proceeding with the Bencher report"
          echo skip=false >> "$GITHUB_OUTPUT"
        elif echo "$NAMES" | grep -Fxq -- "$INPUT_ARTIFACT_NAME"; then
          echo skip=false >> "$GITHUB_OUTPUT"
        else
          echo skip=true >> "$GITHUB_OUTPUT"
          echo "The producer has no current benchmark artifact. Nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::The producer has no current benchmark artifact, skipping"
        fi
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}

    - name: Install Bencher
      if: steps.check.outputs.skip != 'true'
      uses: bencherdev/bencher@8d75325c3bc59403a2186a056b472c4f49d42838 # v0.6.12
      with:
        version: 0.6.12
    - name: Report benchmarks
      if: steps.check.outputs.skip != 'true'
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/report.py"
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_API_TOKEN: ${{ inputs.api-token }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_PR_POLICY: ${{ inputs.pr-policy }}
        INPUT_CI_ID: ${{ inputs.ci-id }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
